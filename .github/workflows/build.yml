name: Android APK build

on:
  push:
    branches: [main]
    paths:
      - 'TeleVipNext-Telegraph-SettingsMenu-Fix.zip'
      - 'patches/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source archive
        run: |
          test -f TeleVipNext-Telegraph-SettingsMenu-Fix.zip
          unzip -t TeleVipNext-Telegraph-SettingsMenu-Fix.zip

      - name: Extract project
        run: |
          mkdir source
          unzip -q TeleVipNext-Telegraph-SettingsMenu-Fix.zip -d source
          SETTINGS_FILE=$(find source -name settings.gradle -print -quit)
          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE=$(find source -name settings.gradle.kts -print -quit)
          fi
          test -n "$SETTINGS_FILE"
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          test -f "$PROJECT_DIR/gradlew"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Apply Graph Messenger 13.2 settings hook fix
        run: |
          python3 patches/apply_telegraph_settings_13_2.py "$PROJECT_DIR"
          grep -q 'TelegraphSettingsHook' "$PROJECT_DIR/app/src/main/java/com/my/televip/settings/SettingsManager.java"
          mkdir -p dist
          (cd "$PROJECT_DIR" && zip -qr "$GITHUB_WORKSPACE/dist/TeleVipNext-Telegraph-13.2.2.2-patched-source.zip" .)

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Build release APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleRelease

      - name: Sign APK for installation
        run: |
          set -euo pipefail
          UNSIGNED_APK="$(find "$PROJECT_DIR/app/build/outputs/apk/release" -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$UNSIGNED_APK"
          SIGNING_PASSWORD="$(openssl rand -hex 24)"
          KEYSTORE="$RUNNER_TEMP/televip-build-key.jks"
          keytool -genkeypair -noprompt -keystore "$KEYSTORE" -storetype JKS \
            -storepass "$SIGNING_PASSWORD" -keypass "$SIGNING_PASSWORD" \
            -alias televip -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=TeleVip Next Build"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-key-alias televip \
            --ks-pass "pass:$SIGNING_PASSWORD" --key-pass "pass:$SIGNING_PASSWORD" \
            --out "$GITHUB_WORKSPACE/dist/TeleVipNext-Telegraph-13.2.2.2-signed.apk" "$UNSIGNED_APK"
          "$APKSIGNER" verify --verbose "$GITHUB_WORKSPACE/dist/TeleVipNext-Telegraph-13.2.2.2-signed.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: televipnext-telegraph-settingsmenu-signed-apk
          path: dist/TeleVipNext-Telegraph-13.2.2.2-signed.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload patched source
        uses: actions/upload-artifact@v4
        with:
          name: televipnext-telegraph-patched-source
          path: dist/TeleVipNext-Telegraph-13.2.2.2-patched-source.zip
          if-no-files-found: error
          retention-days: 14
