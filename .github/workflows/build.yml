name: Android APK build

on:
  push:
    branches: [main]
    paths:
      - 'TeleVipNext-Telegraph-SettingsMenu-Fix.zip'
      - 'patches/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source archive
        run: |
          test -f TeleVipNext-Telegraph-SettingsMenu-Fix.zip
          unzip -t TeleVipNext-Telegraph-SettingsMenu-Fix.zip

      - name: Extract project
        run: |
          mkdir source
          unzip -q TeleVipNext-Telegraph-SettingsMenu-Fix.zip -d source
          SETTINGS_FILE=$(find source -name settings.gradle -print -quit)
          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE=$(find source -name settings.gradle.kts -print -quit)
          fi
          test -n "$SETTINGS_FILE"
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          test -f "$PROJECT_DIR/gradlew"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Apply Graph Messenger 13.2 settings hook fix
        run: |
          python3 patches/apply_telegraph_settings_13_2.py "$PROJECT_DIR"
          grep -q 'SCHEMA_VERSION = 33' "$PROJECT_DIR/app/src/main/java/com/my/televip/obfuscate/auto/AutoMappingResolver.java"
          mkdir -p dist
          (cd "$PROJECT_DIR" && zip -qr "$GITHUB_WORKSPACE/dist/TeleVipNext-Telegraph-13.2.2.2-patched-source.zip" .)

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Build release APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: televipnext-telegraph-settingsmenu-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload patched source
        uses: actions/upload-artifact@v4
        with:
          name: televipnext-telegraph-patched-source
          path: dist/TeleVipNext-Telegraph-13.2.2.2-patched-source.zip
          if-no-files-found: error
          retention-days: 14
