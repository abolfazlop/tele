name: Android APK build

on:
  push:
    branches: [main]
    paths:
      - 'tele-GraphMessenger-13.2.2.2-source.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source archive
        run: |
          test -f tele-GraphMessenger-13.2.2.2-source.zip
          unzip -t tele-GraphMessenger-13.2.2.2-source.zip

      - name: Extract project
        run: |
          mkdir source
          unzip -q tele-GraphMessenger-13.2.2.2-source.zip -d source
          PROJECT_DIR="$(find source -name settings.gradle -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build release APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tele-graphmessenger-13.2.2.2-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
